<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>考研英语高阶训练器</title>
  <meta name="description" content="考研英语长难句拆解与大作文模板填空：按题型选一篇整篇模板，逐空填写，AI 逐空判断对错并给出可替换写法。">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4b3fe3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="考研英语">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>考研英语高阶训练器</h1>
        <p class="sub">长难句拆解 · 大作文模板填空</p>
      </div>
      <button id="btn-settings" class="btn ghost small" aria-haspopup="dialog">设置<span class="dot" id="key-dot" hidden></span></button>
    </div>
  </header>

  <main class="page">
    <nav class="tabs" role="tablist" aria-label="学习模块">
      <button class="tab is-active" id="tab-sentence" role="tab" data-tab="sentence" aria-selected="true" aria-controls="panel-sentence">长难句拆解</button>
      <button class="tab" id="tab-tpl" role="tab" data-tab="tpl" aria-selected="false" aria-controls="panel-tpl">模板填空</button>
      <button class="tab" id="tab-review" role="tab" data-tab="review" aria-selected="false" aria-controls="panel-review">复盘</button>
    </nav>

    <!-- 长难句 -->
    <section id="panel-sentence" class="panel" role="tabpanel" aria-labelledby="tab-sentence">
      <label class="field">
        <span class="label">英文长难句</span>
        <textarea id="sentence-input" rows="4" placeholder="粘贴一句真题阅读里的长句，例如：The idea that ..."></textarea>
      </label>
      <label class="field">
        <span class="label">先自己划主干（选填，对答案时会并排显示你的版本）</span>
        <input id="sentence-spine" type="text" spellcheck="false" placeholder="例如：The idea / has shaped / the way we work.">
      </label>
      <div class="row">
        <button id="btn-sentence" class="btn primary">一键拆解</button>
        <span class="tip">先自己划主干，再对答案，效果最好</span>
      </div>
      <article id="sentence-result" class="result" hidden></article>
    </section>

    <!-- 模板填空 -->
    <section id="panel-tpl" class="panel" role="tabpanel" aria-labelledby="tab-tpl" hidden>
      <p class="hint tpl-intro">七篇整篇连排模板，按题型选一篇。你只需要把编号空位换成自己的主题词、数据和观点，填完交给 AI 逐空判断。</p>
      <div id="tpl-pick" class="tpl-pick"></div>

      <div id="tpl-work" hidden>
        <div class="tpl-head" id="tpl-head"></div>

        <div class="tpl-topic">
          <label class="field">
            <span class="label">练习题目（选填，选中后按真题主题填）</span>
            <select id="tpl-topic-select">
              <option value="">不指定题目（用示例主题练手）</option>
            </select>
          </label>
          <div id="tpl-topic-box" class="tpl-topic-box" hidden></div>
        </div>

        <div class="tpl-body" id="tpl-body"></div>
        <div id="tpl-tips"></div>

        <div class="tpl-actions">
          <span class="tpl-progress" id="tpl-progress">已填 0 / 0 空</span>
          <button id="btn-tpl-copy-mine" class="btn ghost">复制我的全文</button>
          <button id="btn-tpl-judge" class="btn primary">交给 AI 判断</button>
          <button id="btn-tpl-copy" class="btn ghost" hidden>复制 AI 修正版</button>
          <button id="btn-tpl-clear" class="btn ghost">清空</button>
        </div>

        <article id="tpl-result" class="result" hidden></article>
      </div>
    </section>

    <!-- 复盘 -->
    <section id="panel-review" class="panel" role="tabpanel" aria-labelledby="tab-review" hidden>
      <div class="review-head">
        <h2>填空复盘</h2>
        <button id="btn-clear-review" class="btn ghost small">清空记录</button>
      </div>
      <p class="hint" id="review-summary"></p>
      <div class="chips" id="review-blanks"></div>
      <div id="review-templates" class="review-templates"></div>
      <div id="review-list" class="review-list"></div>
    </section>
  </main>

  <!-- 设置 -->
  <div id="settings" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">API 设置</h2>
        <button class="btn ghost small" id="btn-close-settings" aria-label="关闭">关闭</button>
      </div>

      <label class="field">
        <span class="label">服务商</span>
        <select id="set-provider"></select>
      </label>
      <p class="hint" id="set-provider-note"></p>

      <label class="field">
        <span class="label">Base URL</span>
        <input id="set-baseurl" type="url" spellcheck="false" placeholder="https://api.moonshot.cn/v1">
      </label>

      <label class="field">
        <span class="label">模型名</span>
        <input id="set-model" type="text" spellcheck="false" placeholder="moonshot-v1-8k">
      </label>

      <label class="field">
        <span class="label">API Key</span>
        <input id="set-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-...">
      </label>

      <label class="check">
        <input type="checkbox" id="set-stream" checked>
        <span>流式输出（边生成边显示，推荐开启）</span>
      </label>

      <p class="hint">Key 只保存在本机浏览器（localStorage），不会上传到任何服务器。本页直接请求你选择的服务商，没有中间服务器。</p>

      <div class="row">
        <button id="btn-test" class="btn">测试连接</button>
        <button id="btn-save" class="btn primary">保存</button>
      </div>
      <p class="status" id="test-result" hidden></p>

      <details class="details">
        <summary>服务商跨域限制说明</summary>
        <p>Moonshot、阿里百炼、硅基流动、OpenRouter 已验证允许网页直连；智谱的接口未开放跨域，需要自建代理（仓库里附了 20 行的 Cloudflare Worker）。</p>
      </details>
    </div>
  </div>

  <!-- 全局状态条 -->
  <div id="statusbar" class="statusbar" hidden>
    <span class="spinner" aria-hidden="true"></span>
    <span id="status-text">正在生成…</span>
    <button id="btn-stop" class="link-btn">停止</button>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/storage.js"></script>
  <script src="assets/api.js"></script>
  <script src="assets/markdown.js"></script>
  <script src="assets/runner.js"></script>
  <script src="assets/review.js"></script>
  <script src="assets/templates-data.js"></script>
  <script src="assets/tpl.js"></script>
  <script src="assets/ui.js"></script>
</body>
</html>
